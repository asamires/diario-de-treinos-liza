<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <title>Cadastro | Diário de Treinos</title>
</head>

<body>

    <main class="login-container">

        <header class="login-header">
            <h1>Diário de <span>Treinos</span></h1>
            <p>Crie sua conta e acompanhe sua evolução.</p>
        </header>

        <section class="login-form">

            <h2>Criar conta</h2>

            <form id="formCadastro">

                <div class="form-group">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" maxlength="80" placeholder="Apenas letras" required>
                </div>

                <div class="form-group">
                    <label for="dataNascimento">Data de nascimento:</label>
                    <input type="date" id="dataNascimento" required>
                </div>

                <div class="form-group">
                    <label for="user">Nome de usuário (user):</label>
                    <input type="text" id="user" maxlength="30" placeholder="Ex: davi_silva" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" maxlength="120" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" minlength="6" placeholder="Mínimo de 6 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="confirmarSenha">Confirmar senha:</label>
                    <input type="password" id="confirmarSenha" minlength="6" placeholder="Repita sua senha" required>
                </div>

                <button type="submit">Cadastrar</button>

            </form>

            <p class="cadastro-link">
                Já possui uma conta?
                <a href="login.html">Fazer login</a>
            </p>

        </section>

    </main>

    <script src="../js/auth.js"></script>
</body>
</html>
