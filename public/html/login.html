<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <title>Login | Diário de Treinos</title>
</head>

<body>

    <main class="login-container">

        <header class="login-header">
            <h1>Diário de <span>Treinos</span></h1>
            <p>Registre seus exercícios e acompanhe sua evolução.</p>
        </header>

        <section class="login-form">

            <h2>Acesse sua conta</h2>

            <form id="formLogin">

                <div class="form-group">
                    <label for="email">E-mail ou User:</label>
                    <input type="text" id="email" name="email" placeholder="Digite seu e-mail ou user" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit">Entrar</button>

            </form>

            <p class="cadastro-link">
                Não possui uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </section>

    </main>

    <script src="../js/auth.js"></script>
</body>
</html>
